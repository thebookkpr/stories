<!DOCTYPE html>
<!-- The Book Keeper's Library (site menu) — index.html V1.4 · Part 1 of 2
     V1.4: new hobbit-hole library room (images/library-bg.jpg) and new green
           moon-rabbit book (images/book-burrow-whispers.png). Text overlay on the
           book removed (the cover art carries the title). New animations: gentle
           book float, golden cover shimmer, warm lantern-light breathing, soft
           fade-in for the page. All motion is switched off for reduced-motion.
     V1.3: candle glows removed.
     V1.2: label position matched to the book sprite.
     V1.1: painted room background and closed-book sprite per world.
     V1.0: first release.
     Lives at stories/index.html.
     Uses css/variables.css, css/base.css and css/effects.css from this same folder.
     To add a world: add one entry to the WORLDS list near the bottom. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120a07">
  <title>The Book Keeper's Library</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/effects.css">
  <style>
    /* Painted room behind everything; a soft dark wash keeps text readable.
       The art is tall (portrait), so it is anchored near the top to keep the
       round door in view on wide screens. */
    .room {
      position: fixed;
      inset: 0;
      z-index: var(--z-bg);
      pointer-events: none;
      background:
        linear-gradient(rgba(18, 10, 7, 0.2), rgba(18, 10, 7, 0.45)),
        url("images/library-bg.jpg") center 25% / cover no-repeat;
    }

    /* Lantern-light breathing: a warm glow that slowly swells and settles */
    .lantern-light {
      position: fixed;
      inset: 0;
      z-index: var(--z-bg);
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%,
        rgba(255, 190, 90, 0.22) 0%,
        rgba(255, 190, 90, 0) 65%);
      mix-blend-mode: screen;
      animation: lantern-breathe 7s ease-in-out infinite;
    }
    @keyframes lantern-breathe {
      0%, 100% { opacity: 0.45; }
      35%      { opacity: 0.9; }
      55%      { opacity: 0.7; }
    }

    /* The page content eases in */
    .page { animation: page-in 1.6s var(--ease-gentle) both; }
    @keyframes page-in {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .library-title {
      margin: 0;
      font-weight: normal;
      font-size: clamp(1.7rem, 6vw, 3.6rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 20px var(--gold-glow), 0 3px 10px rgba(0, 0, 0, 0.8);
    }
    .library-motto {
      margin: 1em 0 0;
      font-style: italic;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      color: var(--parchment);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    .library-tag {
      margin: 0;
      font-family: var(--font-ui);
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* The shelf: each world is a closed book */
    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 280px));
      justify-content: center;
      gap: 34px 28px;
      margin: 2em 0 0;
      padding: 0;
      list-style: none;
    }
    .book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--parchment);
      text-decoration: none;
      text-align: center;
    }
    .book-cover {
      position: relative;
      width: 100%;
      overflow: hidden;            /* keeps the shimmer inside the book */
      border-radius: 4px 12px 12px 4px;
    }

    /* The book floats gently, as if resting on a breath of air */
    .book-sprite {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.65));
      animation: book-float 6s ease-in-out infinite;
      transition: filter var(--fade-fast) var(--ease-gentle);
    }
    @keyframes book-float {
      0%, 100% { transform: translateY(0) rotate(-0.4deg); }
      50%      { transform: translateY(-7px) rotate(0.4deg); }
    }

    /* A slow golden shimmer sweeps across the cover now and then */
    .book-cover::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg,
        rgba(255, 224, 150, 0) 38%,
        rgba(255, 224, 150, 0.28) 50%,
        rgba(255, 224, 150, 0) 62%);
      transform: translateX(-120%);
      animation: cover-shimmer 9s ease-in-out 2s infinite;
    }
    @keyframes cover-shimmer {
      0%, 60% { transform: translateX(-120%); }
      100%    { transform: translateX(120%); }
    }

    /* Hover: the book lifts and its gold glows */
    a.book:hover .book-sprite,
    a.book:focus-visible .book-sprite {
      animation-play-state: paused;
      transform: translateY(-10px) scale(1.03);
      filter: drop-shadow(0 16px 14px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 20px var(--gold-glow));
    }
    a.book:focus-visible { outline: none; }

    .book-kind {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .book-desc {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    /* Fallback: if the sprite is missing, show a leather book drawn in CSS */
    .book.fallback .book-sprite { display: none; }
    .book.fallback .book-cover {
      aspect-ratio: 2 / 3;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.5) 0, rgba(0, 0, 0, 0) 14px),
        linear-gradient(145deg, #2f5a45, #1f3b2d);
      border: 1px solid var(--gold-line);
      box-shadow: var(--shadow-soft);
    }

    /* Placeholder: an empty space on the shelf, not clickable */
    .book.soon {
      justify-content: center;
      aspect-ratio: 2 / 3;
      padding: 20px;
      font-style: italic;
      background: rgba(0, 0, 0, 0.22);
      border: 1px dashed var(--gold-line);
      border-radius: 3px 10px 10px 3px;
      opacity: 0.7;
    }

    .keeper {
      margin: 3em 0 0;
      font-style: italic;
      color: var(--gold);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }
    .version {
      margin: 0.8em 0 0;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--brass);
      opacity: 0.7;
    }

    /* Calm everything for players who ask for reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .lantern-light, .page, .book-sprite, .book-cover::after { animation: none; }
      .book-cover::after { display: none; }
      .lantern-light { opacity: 0.6; }
    }
  </style>
</head>

<body>

  <div class="room"></div>
  <div class="lantern-light"></div>
  <div class="backdrop"></div>
  <div class="fx-layer" id="fx"></div>

  <main class="page">
    <h1 class="library-title">The Book Keeper's Library</h1>
    <p class="library-motto">Storybook worlds, kept with care.</p>
    <div class="rule"></div>
    <p class="library-tag">Choose a volume</p>
    <ul class="shelf" id="shelf"></ul>
    <p class="keeper">Kept by The Book Keeper</p>
    <p class="version">V1.4</p>
  </main>

  <script>
    /* ---------- Add new worlds here ----------
       The cover art carries the title, so no label position is needed.
       The title is still used as the image's alt text for screen readers. */
    const WORLDS = [
      {
        title: "Burrow Whispers",
        kind: "Volume I · Gentle Fantasy",
        desc: "A quiet world of little lives and moonlit woods, where small pets find wonder close to home.",
        url: "burrow-whispers/",
        sprite: "images/book-burrow-whispers.png"
      }
    ];
    const SHOW_COMING_SOON = true;   /* set false to hide the empty space on the shelf */

    /* ---------- Build the shelf ---------- */
    const shelf = document.getElementById("shelf");
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text) n.textContent = text;
      return n;
    };

    WORLDS.forEach((w, i) => {
      const li = el("li");
      const a = el("a", "book");
      a.href = w.url;
      a.setAttribute("aria-label", w.title + " — " + w.kind);

      const cover = el("div", "book-cover");
      const img = new Image();
      img.className = "book-sprite";
      img.alt = w.title;
      img.style.animationDelay = (-i * 1.5) + "s";   /* books bob out of step */
      img.onerror = () => a.classList.add("fallback");
      img.src = w.sprite;
      cover.append(img);

      a.append(cover, el("p", "book-kind", w.kind), el("p", "book-desc", w.desc));
      li.appendChild(a);
      shelf.appendChild(li);
    });

    if (SHOW_COMING_SOON) {
      const li = el("li");
      li.appendChild(el("div", "book soon", "More volumes are being written."));
      shelf.appendChild(li);
    }

    /* ---------- Candlelit effects (styles come from effects.css) ---------- */
    const rand = (a, b) => a + Math.random() * (b - a);
    const fx = document.getElementById("fx");
    function add(cls, style, vars) {
      const d = el("div", cls);
      if (style) d.style.cssText = style;
      if (vars) Object.entries(vars).forEach(([k, v]) => d.style.setProperty(k, v));
      fx.appendChild(d);
    }
    add("haze one"); add("haze two");
    for (let i = 0; i < 16; i++)
      add("mote", `left:${rand(5, 95).toFixed(1)}%;top:${rand(10, 90).toFixed(1)}%`, {
        "--dur": rand(5, 9).toFixed(1) + "s",
        "--delay": (-rand(0, 9)).toFixed(1) + "s",
        "--drift": rand(-30, 30).toFixed(0) + "px"
      });
  </script>

</body>
</html>
