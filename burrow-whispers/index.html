<!DOCTYPE html>
<!-- Burrow Whispers Series Menu: index.html V2.0 · Part 1 of 1
     Lives at stories/burrow-whispers/index.html
     Uses css/variables.css, css/base.css and css/effects.css.
     To add a story: change a "Volume Unwritten" shelf into an
     available one (copy the Lunelle shelf, swap name, link, sprite). -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Burrow Whispers | The Book Keeper</title>
    <meta name="description" content="A collection of stories gathered from the Moonroot Wilds.">

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/effects.css">
</head>

<body>

    <header>
        <nav aria-label="Main navigation">
            <a href="../index.html">← Return to Library</a>
        </nav>
    </header>

    <main>

        <h1>Burrow Whispers</h1>
        <p class="collection-subtitle">
            A collection of stories gathered from the Moonroot Wilds.
        </p>

        <section class="story-shelf" aria-labelledby="story-shelf-title">

            <h2 id="story-shelf-title">Story Volumes</h2>

            <!-- Shelf 1: Available -->
            <article class="story-volume story-volume-available">
                <a class="story-book-link"
                   href="./lunelle/index.html"
                   aria-label="Open Lunelle">
                    <img class="story-book-sprite"
                         src="./images/lunelle-book.png"
                         alt="Lunelle storybook">
                    <span class="story-title">Lunelle</span>
                    <span class="story-action">Open Volume →</span>
                </a>
            </article>

            <!-- Shelf 2: Coming Soon -->
            <article class="story-volume story-volume-coming-soon">
                <div class="story-book-link">
                    <img class="story-book-sprite"
                         src="./images/unwritten-book.png"
                         alt="An unwritten storybook">
                    <span class="story-title">Volume Unwritten</span>
                    <span class="story-action">Coming Soon</span>
                </div>
            </article>

            <!-- Shelf 3: Coming Soon -->
            <article class="story-volume story-volume-coming-soon">
                <div class="story-book-link">
                    <img class="story-book-sprite"
                         src="./images/unwritten-book.png"
                         alt="An unwritten storybook">
                    <span class="story-title">Volume Unwritten</span>
                    <span class="story-action">Coming Soon</span>
                </div>
            </article>

        </section>

    </main>

</body>
</html>
