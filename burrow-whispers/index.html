<!DOCTYPE html>
<!-- PROJECT: Book Keeper — Website
     FILE: Burrow Whispers Crossroads · index.html
     VERSION: 1.0 · Part 1 of 1
     Lives at stories/burrow-whispers/index.html

     Pictures (in images/):
       burrowwhispers-crossroads.jpg       main background (tall phones, 9:20)
       burrowwhispers-crossroads-tablet.jpg tablet edition (wide, 4:3)
       burrowwhispers-crossroads-916.jpg    older cellphone edition (9:16, default)

     Picture rules: the media queries in the <source> tags must match
     the ones in css/variables.css.
       - Wider than square (min-aspect-ratio 1/1): tablet picture
       - Taller than 9:17 (max-aspect-ratio 9/17): main picture
       - Everything else: 9:16 picture

     Companion files from this folder:
       css/variables.css, css/base.css, css/effects.css, js/crossroads.js

     Place text, links, hints and the mailbox letter are edited in
     js/crossroads.js, not here.
     Hot spot positions are edited in css/variables.css.

     There is no About page. The mailbox on this page holds the
     introduction to Burrow Whispers. Visitors tap it to read the letter. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1210">
  <title>Burrow Whispers | The Book Keeper</title>
  <meta name="description" content="A collection of stories gathered from the Moonroot Wilds.">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/effects.css">
  <script src="js/crossroads.js" defer></script>
</head>

<body>

  <!-- The picture and its hot spots -->
  <div class="world" id="world">
    <div class="stage" id="stage">
      <picture>
        <!-- Tablets and other wide screens: the tablet picture -->
        <source media="(min-aspect-ratio: 1/1)"
                srcset="images/burrowwhispers-crossroads-tablet.jpg">
        <!-- Tall phones (taller than 9:17): the main picture -->
        <source media="(max-aspect-ratio: 9/17)"
                srcset="images/burrowwhispers-crossroads.jpg">
        <!-- Everything else: the 9:16 picture -->
        <img class="stage-image"
             src="images/burrowwhispers-crossroads-916.jpg"
             alt="A sunlit woodland crossroads with a carved waystone, a lotus pond, a lantern-lit trail, a wooden mailbox and round-door burrows on a hillside.">
      </picture>

      <button class="hot" data-id="pond"     type="button" aria-label="Moonroot Pond"></button>
      <button class="hot" data-id="moon"     type="button" aria-hidden="true" tabindex="-1"></button>
      <button class="hot" data-id="waystone" type="button" aria-label="The Crossroads Stone"></button>
      <button class="hot" data-id="trail"    type="button" aria-label="The Lantern Trail"></button>
      <button class="hot" data-id="hill"     type="button" aria-label="Burrow Hill"></button>
      <button class="hot" data-id="mailbox"  type="button" aria-label="The Mailbox: read the introduction"></button>
      <button class="hot" data-id="clearing" type="button" aria-label="The Clearing"></button>
      <button class="hot" data-id="secret"   type="button" aria-hidden="true" tabindex="-1"></button>

      <!-- Opening titles: play once, then vanish -->
      <div class="intro">
        <h1 class="intro-title">Burrow Whispers</h1>
        <p class="intro-subtitle">A collection of stories gathered from the Moonroot Wilds.</p>
      </div>
    </div>
  </div>

  <!-- Firefly dust and haze (built by the script) -->
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <!-- Back link (stays, small) -->
  <header class="top">
    <nav aria-label="Main navigation">
      <a class="back" href="../index.html">← Return to Library</a>
    </nav>
  </header>

  <!-- Idle hint line -->
  <p class="hint" id="hint" aria-live="polite"></p>

  <!-- Discovery panel: stage 1 of the two-stage tap -->
  <section class="panel" id="panel" aria-live="polite" aria-labelledby="panel-title">
    <button class="panel-close" id="panel-close" type="button" aria-label="Close">×</button>
    <h2 class="panel-title" id="panel-title"></h2>
    <p class="panel-text" id="panel-text"></p>
    <a class="panel-go" id="panel-go" href="#"></a>
  </section>

  <!-- Mailbox letter: the introduction to Burrow Whispers.
       Opens when the visitor taps the mailbox. Text comes from the script. -->
  <section class="letter" id="letter" role="dialog" aria-modal="true" aria-labelledby="letter-title" hidden>
    <button class="letter-close" id="letter-close" type="button" aria-label="Close the letter">×</button>
    <h2 class="letter-title" id="letter-title"></h2>
    <div class="letter-body" id="letter-body"></div>
    <p class="letter-sign" id="letter-sign"></p>
  </section>

</body>
</html>
