<!DOCTYPE html>

     Uses css/variables.css, css/base.css and css/effects.css V2.0 from this folder.
     Part 2 continues INSIDE the script below: paste it straight after the last line of this Part. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1210">
  <title>Burrow Whispers | The Book Keeper</title>
  <meta name="description" content="A collection of stories gathered from the Moonroot Wilds.">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/effects.css">
</head>

<body>

  <!-- The picture and its hot spots (positions are set in variables.css) -->
  <div class="world" id="world">
    <div class="stage" id="stage">
      <img class="stage-image"
           src="images/burrow-whispers-crossroads.jpg"
           alt="A moonlit woodland crossroads with a carved waystone, a lotus pond, a lantern-lit trail and round-door burrows on a hillside.">

      <button class="hot" data-id="pond"     type="button" aria-label="Moonroot Pond"></button>
      <button class="hot" data-id="moon"     type="button" aria-hidden="true" tabindex="-1"></button>
      <button class="hot" data-id="waystone" type="button" aria-label="The Crossroads Stone"></button>
      <button class="hot" data-id="trail"    type="button" aria-label="The Lantern Trail"></button>
      <button class="hot" data-id="hill"     type="button" aria-label="Burrow Hill"></button>
      <button class="hot" data-id="clearing" type="button" aria-label="The Clearing"></button>
      <button class="hot" data-id="secret"   type="button" aria-hidden="true" tabindex="-1"></button>
    </div>
  </div>

  <!-- Firefly dust and haze (built by the script) -->
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <!-- Title zone -->
  <header class="top">
    <nav aria-label="Main navigation">
      <a class="back" href="../index.html">← Return to Library</a>
    </nav>
    <h1 class="page-title">Burrow Whispers</h1>
    <p class="page-subtitle">A collection of stories gathered from the Moonroot Wilds.</p>
  </header>

  <!-- Idle hint line -->
  <p class="hint" id="hint" aria-live="polite"></p>

  <!-- Discovery panel: stage 1 of the two-stage tap -->
  <section class="panel" id="panel" aria-live="polite" aria-labelledby="panel-title">
    <button class="panel-close" id="panel-close" type="button" aria-label="Close">×</button>
    <h2 class="panel-title" id="panel-title"></h2>
    <p class="panel-text" id="panel-text"></p>
    <a class="panel-go" id="panel-go" href="#"></a>
  </section>

  <script>
    /* ---------- Places ----------
       id     matches data-id on the hot spot buttons above
       title  panel heading
       text   panel flavour text (use \n for a line break)
       go     the button words, e.g. "Explore →"
       url    where stage 2 travels to; null = nothing to visit yet,
              so the panel shows its text with no button
       lights which hot spots glow when this place is noticed
       hint   idle line shown at the bottom (null = never hinted)
       To open a place later: change its url from null to a folder. */
    const PLACES = {
      pond: {
        title: "Moonroot Pond",
        text: "A quiet pond shines beneath the moon.\nSomeone often visits here at night.",
        go: "Explore →",
        url: "lunelle/",
        lights: ["pond", "moon"],
        hint: "A faint glow shimmers across the pond..."
      },
      waystone: {
        title: "The Crossroads Stone",
        text: "Many journeys begin here.",
        go: "Read More →",
        url: null,                         /* world lore page not built yet */
        lights: ["waystone"],
        hint: "The old waystone remembers many journeys..."
      },
      trail: {
        title: "The Lantern Trail",
        text: "A lantern-lit path disappears beneath the roots.\nIt has not been walked yet.",
        go: "Follow →",
        url: null,                         /* future story slot */
        lights: ["trail"],
        hint: "A lantern-lit trail disappears beneath the roots..."
      },
      hill: {
        title: "Burrow Hill",
        text: "Warm lights glow behind round doors.\nMany little lives call this place home.",
        go: "Visit →",
        url: null,                         /* future village hub */
        lights: ["hill"],
        hint: "Warm lights flicker among the hillside burrows..."
      },
      clearing: {
        title: "The Clearing",
        text: "Paw prints wander down the path.\nWhat is Burrow Whispers?",
        go: "Learn More →",
        url: "about/",
        lights: ["clearing"],
        hint: null
      }
    };

    /* A tap on the moon counts as a tap on the pond: one place, two spots */
    const ALIASES = { moon: "pond" };

    /* Hints that light nothing; they only teach that the picture holds places */
    const GENERAL_HINTS = [
      "Not every secret path is obvious.",
      "The Wilds reward curious travelers."
    ];

    /* The secret has no panel and no label (see Part 2 for what it opens) */
    const SECRET_URL = null;               /* set a folder here, e.g. "secret/" */
