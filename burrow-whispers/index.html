<!DOCTYPE html>
<!-- Burrow Whispers Crossroads: index.html V2.2 · Part 1 of 1
     Lives at stories/burrow-whispers/index.html
     Replaces V2.1.
     Pictures: images/burrow-whispers-crossroads-916.jpg (default, 9:16)
               images/burrow-whispers-crossroads.jpg (tall phones, 9:20)
     Uses css/variables.css V2.2, css/base.css V2.4, css/effects.css V2.0
     and js/crossroads.js V1.1 from this folder.
     Installable: manifest.json V1.0 and the icons in images/.
     Place text, links and hints are edited in js/crossroads.js, not here.
     Hot spot positions are edited in css/variables.css.
     V2.0: the picture is now a <picture> element.
     V2.1: cutoff changed from 9/18 to 9/17 so phones with browser bars
           showing still get the 9:20 picture. The media query in <source>
           must match the one in variables.css (max-aspect-ratio: 9/17).
     V2.2: added the web app manifest link and the iPhone home screen
           icon and full screen tags. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1210">
  <title>Burrow Whispers | The Book Keeper</title>
  <meta name="description" content="A collection of stories gathered from the Moonroot Wilds.">

  <!-- Install as an app (full screen, no browser bars) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Burrow Whispers">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/effects.css">
  <script src="js/crossroads.js" defer></script>
</head>

<body>

  <!-- The picture and its hot spots -->
  <div class="world" id="world">
    <div class="stage" id="stage">
      <picture>
        <!-- Tall phones (taller than 9:17): the 9:20 picture -->
        <source media="(max-aspect-ratio: 9/17)"
                srcset="images/burrow-whispers-crossroads.jpg">
        <!-- Everything else: the 9:16 picture -->
        <img class="stage-image"
             src="images/burrow-whispers-crossroads-916.jpg"
             alt="A moonlit woodland crossroads with a carved waystone, a lotus pond, a lantern-lit trail and round-door burrows on a hillside.">
      </picture>

      <button class="hot" data-id="pond"     type="button" aria-label="Moonroot Pond"></button>
      <button class="hot" data-id="moon"     type="button" aria-hidden="true" tabindex="-1"></button>
      <button class="hot" data-id="waystone" type="button" aria-label="The Crossroads Stone"></button>
      <button class="hot" data-id="trail"    type="button" aria-label="The Lantern Trail"></button>
      <button class="hot" data-id="hill"     type="button" aria-label="Burrow Hill"></button>
      <button class="hot" data-id="clearing" type="button" aria-label="The Clearing"></button>
      <button class="hot" data-id="secret"   type="button" aria-hidden="true" tabindex="-1"></button>

      <!-- Opening titles: play once, then vanish -->
      <div class="intro">
        <h1 class="intro-title">Burrow Whispers</h1>
        <p class="intro-subtitle">A collection of stories gathered from the Moonroot Wilds.</p>
      </div>
    </div>
  </div>

  <!-- Firefly dust and haze (built by the script) -->
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <!-- Back link (stays, small) -->
  <header class="top">
    <nav aria-label="Main navigation">
      <a class="back" href="../index.html">← Return to Library</a>
    </nav>
  </header>

  <!-- Idle hint line -->
  <p class="hint" id="hint" aria-live="polite"></p>

  <!-- Discovery panel: stage 1 of the two-stage tap -->
  <section class="panel" id="panel" aria-live="polite" aria-labelledby="panel-title">
    <button class="panel-close" id="panel-close" type="button" aria-label="Close">×</button>
    <h2 class="panel-title" id="panel-title"></h2>
    <p class="panel-text" id="panel-text"></p>
    <a class="panel-go" id="panel-go" href="#"></a>
  </section>

</body>
</html>
