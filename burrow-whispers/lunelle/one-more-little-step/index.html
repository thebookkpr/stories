<!DOCTYPE html>
<!-- One More Little Step — index.html V1.0
     Project: One More Little Step (Burrow Whispers, Lunelle)
     Part 1 of 1 (HTML)

     V1.0: NEW BEGINNING. Versions restart at 1.0.
           Added js/guidance.js (the new help system). It loads after
           effects.js and before game.js.
           Script and stylesheet cache-busting reset to ?v=1.0
           (bump it whenever a file changes).
           Service worker (sw.js) registered for offline play and install.
           Manifest linked. -->
<html lang="en">
<head>

  <meta name="color-scheme" content="dark">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1830">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="images/title-screen.jpg">
  <title>One More Little Step</title>

  <link rel="stylesheet" href="css/variables.css?v=1.0">
  <link rel="stylesheet" href="css/base.css?v=1.0">
  <link rel="stylesheet" href="css/title.css?v=1.0">
  <link rel="stylesheet" href="css/scene.css?v=1.0">
  <link rel="stylesheet" href="css/ui.css?v=1.0">
  <link rel="stylesheet" href="css/effects.css?v=1.0">
  <link rel="stylesheet" href="css/responsive.css?v=1.0">
</head>

<body>

  <div id="game">

    <section id="title-screen" class="screen active">
      <div class="bg"></div>
      <div class="title-block">
        <h1 class="game-title">ONE MORE LITTLE STEP</h1>
        <p class="game-subtitle">A Burrow Whispers Story</p>
      </div>
      <nav class="menu">
        <button class="menu-btn primary" id="btn-start">Start Journey</button>
        <button class="menu-btn" id="btn-continue" disabled>Continue</button>
        <button class="menu-btn" id="btn-settings">Settings</button>
        <button class="menu-btn" id="btn-credits">Credits</button>
      </nav>

      <p class="version">V1.0</p>

    </section>

  </div>

  <script src="js/scenes.js?v=1.0"></script>
  <script src="js/effects.js?v=1.0"></script>
  <script src="js/audio.js?v=1.0"></script>
  <script src="js/guidance.js?v=1.0"></script>
  <script src="js/game.js?v=1.0"></script>
  <script src="js/save.js?v=1.0"></script>

  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () =>
      navigator.serviceWorker.register("sw.js"));
  }
  </script>

</body>
</html>
