<!DOCTYPE html>
<!-- One More Little Step — index.html V1.3
     Project: One More Little Step (Burrow Whispers, Lunelle)
     Part 1 of 1 (HTML)

     V1.3: Desktop picture for Scene 5 added (scenes.js V1.4, sw.js V1.5).
           Script and stylesheet cache-busting set to ?v=1.3 so devices
           load the new files. On-screen version label now reads V1.3.
     V1.2: New title picture (images/titlescreen.jpg) and new
           title.css V1.2 (logo and menu moved). Script and stylesheet
           cache-busting set to ?v=1.2 so devices load the new files.
           On-screen version label now reads V1.2.
     V1.1: Title logo image replaces the title text (the h1 stays
           for screen readers through the image alt text).
           Title picture preload now matches the screen shape:
           desktop 16:9 or phone/tablet.
           Script and stylesheet cache-busting set to ?v=1.1.
     V1.0: NEW BEGINNING. Versions restart at 1.0. -->
<html lang="en">
<head>

  <meta name="color-scheme" content="dark">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1830">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="images/titlescreen-desktop.jpg"
        media="(min-aspect-ratio: 31/20) and (max-aspect-ratio: 39/20)">
  <link rel="preload" as="image" href="images/titlescreen.jpg"
        media="(max-aspect-ratio: 153/100), (min-aspect-ratio: 39/20)">
  <link rel="preload" as="image" href="assets/onemorelittlestep-logo.png">
  <title>One More Little Step</title>

  <link rel="stylesheet" href="css/variables.css?v=1.3">
  <link rel="stylesheet" href="css/base.css?v=1.3">
  <link rel="stylesheet" href="css/title.css?v=1.3">
  <link rel="stylesheet" href="css/scene.css?v=1.3">
  <link rel="stylesheet" href="css/ui.css?v=1.3">
  <link rel="stylesheet" href="css/effects.css?v=1.3">
  <link rel="stylesheet" href="css/responsive.css?v=1.3">
</head>

<body>

  <div id="game">

    <section id="title-screen" class="screen active">
      <div class="bg"></div>
      <div class="title-block">
        <h1 class="game-title">
          <img class="game-logo" src="assets/onemorelittlestep-logo.png"
               alt="One More Little Step">
        </h1>
        <p class="game-subtitle">A Burrow Whispers Story</p>
      </div>
      <nav class="menu">
        <button class="menu-btn primary" id="btn-start">Start Journey</button>
        <button class="menu-btn" id="btn-continue" disabled>Continue</button>
        <button class="menu-btn" id="btn-settings">Settings</button>
        <button class="menu-btn" id="btn-credits">Credits</button>
      </nav>

      <p class="version">V1.3</p>

    </section>

  </div>

  <script src="js/scenes.js?v=1.3"></script>
  <script src="js/effects.js?v=1.3"></script>
  <script src="js/audio.js?v=1.3"></script>
  <script src="js/guidance.js?v=1.3"></script>
  <script src="js/game.js?v=1.3"></script>
  <script src="js/save.js?v=1.3"></script>

  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () =>
      navigator.serviceWorker.register("sw.js"));
  }
  </script>

</body>
</html>
