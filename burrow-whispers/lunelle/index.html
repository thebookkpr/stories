<!DOCTYPE html>
<!-- Lunelle Games Menu — index.html V1.0 · Part 1 of 1
     Lives at stories/burrow-whispers/lunelle/index.html
     Uses css/variables.css, css/base.css and css/effects.css,
     and js/lunelle.js, all from this same folder.
     The pictures are set in css/variables.css (9:20 and 9:16).
     The game address is set at the top of js/lunelle.js. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1830">
  <meta name="description" content="Lunelle's Moonlit Reverie, a quiet pond in the Moonroot Wilds.">
  <title>Lunelle | Burrow Whispers</title>

  <!-- Load the medallion early so it does not pop in -->
  <link rel="preload" as="image" href="./assets/moonlotus-medallion.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/effects.css">
</head>

<body>

  <!-- Return Navigation -->
  <header>
    <nav aria-label="Main navigation">
      <a class="return-link" href="../index.html">← Return to Burrow Whispers</a>
    </nav>
  </header>

  <main class="scene">

    <h1 class="visually-hidden">Lunelle: Moonlit Reverie</h1>

    <!-- The picture. Hot spots are placed on it in percentages. -->
    <div class="stage">

      <!-- Invisible tap zone over the moon's reflection -->
      <button
        class="reflection-hotspot"
        type="button"
        aria-label="Touch the moon's reflection in the pond"
      >
        <span class="visually-hidden">Touch the moon's reflection</span>
      </button>

      <!-- Moon Lotus Medallion: hidden until the reflection is tapped.
           Opens the first game, One More Little Step. -->
      <button
        class="medallion"
        type="button"
        aria-label="Open One More Little Step"
      >
        <span class="medallion-img" role="img" aria-label="Moon Lotus medallion"></span>
      </button>

      <!-- Mist, moths, shimmer and ripples are added here by js/lunelle.js -->

    </div>

    <!-- Idle whisper, filled in by js/lunelle.js -->
    <p class="whisper" aria-hidden="true"></p>

    <!-- Fade-out before the game opens -->
    <div class="travel-veil" aria-hidden="true"></div>

  </main>

  <!-- If JavaScript is off, the game is still reachable -->
  <noscript>
    <a
      href="./one-more-little-step/index.html"
      style="position:fixed;z-index:9;left:50%;bottom:12vh;transform:translateX(-50%);
             padding:0.8em 1.4em;color:#f7f3ea;background:#3c3464;
             border-radius:999px;font-family:Georgia,serif;text-decoration:none;"
    >Play One More Little Step</a>
  </noscript>

  <script src="./js/lunelle.js" defer></script>

</body>
</html>
