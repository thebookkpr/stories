<!DOCTYPE html>
<!-- PROJECT: Burrow Whispers — Book Keeper Website
     FILE: Moonlit Reverie, Lunelle's Home Region · index.html
     VERSION: V1.0 · Part 1 of 1
     Lives at stories/burrow-whispers/lunelle/index.html
     Uses css/variables.css, css/base.css, css/effects.css
     and js/lunelle.js, all from this same folder.
     The three pictures are set in css/variables.css:
       images/moonlitreverie-bg.jpg      (main)
       images/moonlitreverie-tablet.jpg  (tablet)
       images/moonlitreverie-916.jpg     (older cellphones)
     Hot spot places are set in css/base.css.
     Lore, routes and game addresses are set in js/lunelle.js.
     Lunelle is not shown on this page yet. If she is added later,
     she will be a separate sprite picture over the background. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1830">
  <meta name="description" content="Moonlit Reverie, Lunelle's home region in the Moonroot Wilds.">
  <title>Moonlit Reverie | Burrow Whispers</title>

  <!-- Fonts: Cormorant Garamond (titles) and Nunito (reading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Nunito:wght@400;600&display=swap">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/effects.css">
</head>

<body>

  <!-- Return Navigation -->
  <header>
    <nav aria-label="Main navigation">
      <a class="return-link" href="../index.html">← Return to Burrow Whispers</a>
    </nav>
  </header>

  <main class="scene">

    <h1 class="visually-hidden">Moonlit Reverie: Lunelle's Home Region</h1>

    <!-- The picture. Hot spots sit on it in percentages.
         Mist, particles, ripples and the Silver Moth
         are added here by js/lunelle.js -->
    <div class="stage">

      <!-- Type C: places (tap, read, read more, then travel) -->
      <button class="spot" type="button" data-spot="moonroot"    aria-label="Ancient Moonroot"></button>
      <button class="spot" type="button" data-spot="hollow"      aria-label="Moss Hollow"></button>
      <button class="spot" type="button" data-spot="meadow"      aria-label="Moon Blossom Meadow"></button>
      <button class="spot" type="button" data-spot="stone"       aria-label="Moonwatch Stone"></button>
      <button class="spot" type="button" data-spot="pond"        aria-label="Moon Lotus Pond"></button>
      <button class="spot" type="button" data-spot="shore"       aria-label="Lotus Shore"></button>
      <button class="spot" type="button" data-spot="trail"       aria-label="Shoreline Trail"></button>
      <button class="spot" type="button" data-spot="grove"       aria-label="Silver Light Grove"></button>

      <!-- Hidden Root Path: not highlighted, found by looking -->
      <button class="spot" type="button" data-spot="rootpath"    aria-label="Roots, slightly unusual"></button>

      <!-- Type A and D: small touch objects -->
      <button class="spot" type="button" data-spot="reflection"  aria-label="The moon's reflection"></button>
      <button class="spot" type="button" data-spot="lotus"       aria-label="Moon lotus cluster"></button>
      <button class="spot" type="button" data-spot="petals"      aria-label="Drifting petals"></button>

      <!-- Type B: discovery object -->
      <button class="spot" type="button" data-spot="roothollow"  aria-label="A small dark hollow under the roots"></button>

      <!-- Story: the Silver Moth (flown by js/lunelle.js, leads to its game) -->
      <button class="spot" type="button" data-spot="moth"        aria-label="Silver Moth"></button>

    </div>

    <!-- Reading panel. Never closes by itself.
         Filled in by js/lunelle.js -->
    <section class="panel" role="dialog" aria-labelledby="panel-title" aria-live="polite" hidden>
      <h2 class="panel-title" id="panel-title"></h2>
      <p class="panel-text"></p>
      <div class="panel-actions"></div>
    </section>

    <!-- Idle whisper, filled in by js/lunelle.js -->
    <p class="whisper" aria-hidden="true"></p>

    <!-- Soft fade before travel -->
    <div class="travel-veil" aria-hidden="true"></div>

  </main>

  <!-- If JavaScript is off, both games are still reachable -->
  <noscript>
    <nav class="noscript-games" aria-label="Lunelle's games"
         style="position:fixed;z-index:9;left:50%;bottom:10vh;transform:translateX(-50%);
                display:flex;flex-direction:column;gap:0.7em;align-items:center;">
      <a href="./one-more-little-step/index.html"
         style="padding:0.8em 1.4em;color:#f7f3ea;background:#3c3464;border-radius:999px;
                font-family:Georgia,serif;text-decoration:none;">Play One More Little Step</a>
      <a href="./the-silver-moth/index.html"
         style="padding:0.8em 1.4em;color:#f7f3ea;background:#3c3464;border-radius:999px;
                font-family:Georgia,serif;text-decoration:none;">Play The Silver Moth</a>
    </nav>
  </noscript>

  <script src="./js/lunelle.js" defer></script>

</body>
</html>
