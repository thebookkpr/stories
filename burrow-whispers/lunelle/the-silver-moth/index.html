<!--
  PROJECT: Burrow Whispers #001 — The Silver Moth
  FILE: index.html
  VERSION: 0.12.0
  PART: 1 of 1
  LOCATION: /stories/burrow-whispers/lunelle/the-silver-moth/
  NOTE: v0.9.0 desktop edition. The scene picture is chosen by js/stage.js
        (Odd-Ratio Screen Rule). Moth and petal are canvas sprites.
        v0.11.0: scrapbook petal icon now loads from images/sprites/.
        v0.12.0: loads js/journal.js; the reward screen no longer holds journal text.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Keep scene colors as designed: stops browser auto dark mode (Opera) from recoloring them -->
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="supported-color-schemes" content="light only">

  <title>The Silver Moth — Burrow Whispers #001</title>

  <!-- Installable app (v0.7.0) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1030">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Silver Moth">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <!-- Fonts: Cormorant Garamond (world) + Nunito (reading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS load order matters: variables first, guidance last -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/guidance.css">
</head>
<body>

<main id="game">

  <!-- SCENE: Moonroot Pond -->
  <section id="scene" aria-label="Moonroot Pond">
    <!-- v0.9.0: js/stage.js picks the picture (phone, tablet or desktop) by screen shape -->
    <img id="bg" alt="Moonroot Pond under a full moon">

    <div id="fireflies" aria-hidden="true"></div>

    <!-- Hotspots are built by game.js from mysteries.js -->
    <div id="hotspots"></div>

    <!-- Petal that floats up on the moth's petal clue (canvas since v0.9.0, painted by game.js) -->
    <canvas id="petal-fx" aria-hidden="true" hidden></canvas>

    <!-- The target: silver light, then the discovery sprite (set by game.js) -->
    <button id="silver-light" type="button" aria-label="The silver light"></button>
    <canvas id="moth" hidden></canvas>

    <!-- Guidance effects layer (v0.8.0): dust, whispers, crest particles -->
    <div id="guide-fx" aria-hidden="true"></div>
  </section>

  <!-- HUD -->
  <header id="hud-left">
    <span>BURROW WHISPERS</span>
    <span>PET #001</span>
    <strong>LUNELLE</strong>
  </header>

  <button id="hud-scrapbook" type="button">
    <span>Moonroot Scrapbook</span>
    <span id="discovery-count">0 Discoveries</span>
  </button>

  <button id="crest-menu" type="button" aria-label="Open scrapbook">🌙</button>

  <div id="hud-clues">Clues <strong id="clue-count">0/4</strong></div>

  <!-- Storybook panel (intro, walk, and finale) -->
  <section id="story-panel" class="overlay" role="dialog" aria-live="polite" hidden>
    <div class="panel-card">
      <h2 id="story-title"></h2>
      <div id="story-text"></div>
      <button id="story-btn" type="button">Continue</button>
    </div>
  </section>

  <!-- Clue dialog: bottom card, Continue appears after a short delay -->
  <div id="clue-dialog" hidden>
    <div class="dialog-card" role="dialog" aria-live="polite" aria-labelledby="dialog-title">
      <h2 id="dialog-title">🌙 Clue Found</h2>
      <p id="dialog-text"></p>
      <p id="dialog-progress">Clues Found: 0 / 4</p>
      <button id="dialog-btn" type="button">Continue</button>
    </div>
  </div>

  <!-- Reward screen (filled by game.js) -->
  <section id="reward" class="overlay" hidden>
    <div class="panel-card">
      <p class="eyebrow">NEW COLLECTIBLES</p>
      <div id="reward-cards" class="reward-cards"></div>
      <p id="reward-quote" class="quote"></p>
      <ul id="reward-list"></ul>
      <button id="reward-btn" type="button">Open the Scrapbook</button>
    </div>
  </section>

  <!-- Moonroot Scrapbook (lists filled by scrapbook.js) -->
  <section id="scrapbook" class="overlay" hidden>
    <div class="book">
      <button id="book-close" type="button" aria-label="Close scrapbook">✕</button>
      <h2>Moonroot Scrapbook</h2>
      <p class="petal-total">
        <img src="images/sprites/moon-petal.png" alt="">
        <span id="petal-total">0</span> Moon Petals
      </p>
      <p class="book-hint">Tap a name to see it up close.</p>

      <div class="pages">
        <div class="page">
          <h3>Discoveries</h3>
          <ul id="discovery-list"></ul>
        </div>
        <div class="page">
          <h3>Keepsakes</h3>
          <ul id="keepsake-list"></ul>
        </div>
      </div>

      <div class="journal-section">
        <h3>Journal Entries</h3>
        <ul id="journal-list"></ul>
      </div>

      <!-- Stickers, Achievements, Frames, Sticker Packs, Journal Themes -->
      <div id="extras"></div>

      <!-- Guidance setting (v0.8.0, filled by scrapbook.js) -->
      <div id="guidance-setting" class="setting"></div>

      <button id="start-over" class="start-over" type="button">Start Over</button>
    </div>
  </section>

  <!-- Viewer: shows a card or a journal entry on its own; tap to close -->
  <div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Collected item">
    <img id="viewer-img" src="" alt="">
    <div id="viewer-text" hidden></div>
    <a id="viewer-save" href="#" download hidden>Save Card</a>
    <p id="viewer-hint">Tap to close</p>
  </div>

</main>

<!-- Script order matters: data, journal text, story, saving, scrapbook, stage, guidance, then the game -->
<script src="js/data.js"></script>
<script src="js/journal.js"></script>
<script src="js/mysteries.js"></script>
<script src="js/save.js"></script>
<script src="js/scrapbook.js"></script>
<script src="js/stage.js"></script>
<script src="js/guidance.js"></script>
<script src="js/game.js"></script>

<!-- Offline play (v0.7.0) -->
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
