<!DOCTYPE html>
<!-- Burrow Whispers About Page: index.html V1.4 · Part 1 of 1
     Lives at stories/burrow-whispers/about/index.html
     Uses css/variables.css, css/base.css and css/effects.css from this same folder.
     Uses js/mailbox.js for the paper and mailbox interaction.
     V1.4: own css and js folders, new background, rootbark paper,
           tap the paper to send it to the mailbox, tap the mailbox to bring it back.
     V1.3: text removed from the paper (now part of the image). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a1210">
  <title>About Burrow Whispers | The Book Keeper</title>
  <meta name="description" content="An introduction to Burrow Whispers and the Moonroot Wilds.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/effects.css">
  <link href="https://fonts.googleapis.com/css2?family=Almendra:ital@0;1&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Background and effects layers -->
  <div class="room"></div>
  <div class="lantern-light"></div>
  <div class="backdrop"></div>
  <div class="fx-layer" id="fx"></div>

  <!-- Mailbox: invisible tap target placed over the mailbox in the painting -->
  <button class="mailbox" id="mailbox" type="button"
          aria-label="Mailbox. The note is out on the page."></button>

  <main class="page">

    <!-- Return Navigation -->
    <nav aria-label="Main navigation">
      <a class="back" href="../index.html">← Return to Burrow Whispers</a>
    </nav>

    <div class="head">
      <h1 class="page-title">About This World</h1>
      <p class="page-subtitle">The Moonroot Wilds</p>
      <div class="rule"></div>
    </div>

    <!-- The floating paper -->
    <section class="paper" aria-label="About Burrow Whispers">
      <img class="paper-img"
           src="./assets/about-intro-rootbark.png"
           alt="Beyond winding roots and quiet woodland paths lies a world of small lives and gentle wonder. Magical animal companions make their homes here, among forests, ponds, and lantern-lit corners. Choose a story and begin your journey.">
    </section>

    <p class="keeper">Kept by the Book Keeper</p>

  </main>

  <script src="./js/mailbox.js" defer></script>

  <script>
    /* ---------- Firefly dust and haze (styles in css/effects.css) ---------- */
    const el = (tag, cls) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      return n;
    };
    const rand = (a, b) => a + Math.random() * (b - a);
    const fx = document.getElementById("fx");
    fx.append(el("div", "haze one"), el("div", "haze two"));
    for (let i = 0; i < 16; i++) {
      const m = el("div", "mote");
      m.style.left = rand(5, 95).toFixed(1) + "%";
      m.style.top = rand(10, 90).toFixed(1) + "%";
      m.style.setProperty("--dur", rand(5, 9).toFixed(1) + "s");
      m.style.setProperty("--delay", (-rand(0, 9)).toFixed(1) + "s");
      m.style.setProperty("--drift", rand(-30, 30).toFixed(0) + "px");
      fx.appendChild(m);
    }
  </script>

</body>
</html>
